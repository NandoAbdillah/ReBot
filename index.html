<!doctype html>
<html lang="id" data-theme="pink">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="LilyBot - Telegram Automation & Multi-Account Dashboard" />
    <meta name="theme-color" content="#fdf2f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/branding/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>LilyBot Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.global = window;
      if (typeof window.fetch === 'function') {
        const originalFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: () => originalFetch,
            set: (v) => { 
              console.warn('Attempt to overwrite window.fetch detected and ignored.');
            }
          });
        } catch (e) {}
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
