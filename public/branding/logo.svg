<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="lilyGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="petalSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow & Circle -->
  <circle cx="50" cy="50" r="44" fill="url(#petalSoft)" fill-opacity="0.85" stroke="#f472b6" stroke-width="2" stroke-opacity="0.4" />
  <circle cx="50" cy="50" r="38" fill="none" stroke="#fb7185" stroke-dasharray="2 3" stroke-width="1.2" opacity="0.6" />
  
  <!-- Lily Petals -->
  <g transform="translate(50, 52)">
    <!-- Back Petals -->
    <path d="M 0,-32 C -18,-15 -22,10 0,22 C 22,10 18,-15 0,-32 Z" fill="url(#lilyGrad)" opacity="0.95" />
    <!-- Left Petal -->
    <path d="M -2,-8 C -26,-12 -34,12 -8,18 C 0,15 2,2 -2,-8 Z" fill="url(#petalSoft)" stroke="#f472b6" stroke-width="1.2" />
    <!-- Right Petal -->
    <path d="M 2,-8 C 26,-12 34,12 8,18 C 0,15 -2,2 2,-8 Z" fill="url(#petalSoft)" stroke="#f472b6" stroke-width="1.2" />
    <!-- Center Inner Stamen -->
    <path d="M 0,14 C -6,2 -8,-16 0,-24 C 8,-16 6,2 0,14 Z" fill="#fff" opacity="0.9" />
    <circle cx="0" cy="-24" r="2.5" fill="#f43f5e" />
    <circle cx="-6" cy="-18" r="2" fill="#fb7185" />
    <circle cx="6" cy="-18" r="2" fill="#fb7185" />
    <circle cx="0" cy="18" r="3" fill="#ec4899" filter="url(#glow)" />
  </g>
</svg>
